name: DevSpec Pi checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devspec-pi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Triaged security audit gate
        # Fails on a high or critical advisory that is not triaged in
        # scripts/audit-allowlist.json with a reason and an unexpired expiry.
        # Its regression tests run in npm test (tests/audit-gate.test.ts).
        run: npm run audit:gate
